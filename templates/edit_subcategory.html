<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
   {% extends 'base.html' %}

{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-6">
        <div class="card shadow border-warning">
            <div class="card-header bg-warning text-dark">
                <h4 class="mb-0">Edit Sub-Category</h4>
            </div>
            <div class="card-body">
                <form method="POST">
                    {% csrf_token %}
                    
                    <div class="mb-3">
                        <label class="form-label">Select Main Category</label>
                        <select name="category" class="form-select" required>
                            {% for cat in categories %}
                                <option value="{{ cat.id }}" 
                                    {% if cat.id == subcategory.category.id %} selected {% endif %}>
                                    {{ cat.name }}
                                </option>
                            {% endfor %}
                        </select>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Sub-Category Name</label>
                        <input type="text" name="name" class="form-control" 
                               value="{{ subcategory.name }}" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Description</label>
                        <textarea name="descriptions" class="form-control" rows="3">{{ subcategory.descriptions }}</textarea>
                    </div>

                    <div class="d-flex justify-content-between">
                        <a href="{% url 'subcategory_list' %}" class="btn btn-secondary">Cancel</a>
                        <button type="submit" class="btn btn-warning">Update Sub-Category</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
</body>
</html>
