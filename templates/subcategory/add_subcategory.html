<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    {% extends 'base.html' %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
       
            <div class="main-card">
                <h3 class="fw-bold mb-4">Add New Sub-Category</h3>
            
            <div class="card-body">
                <form method="POST">
                    {% csrf_token %}
                    
                    <div class="mb-3">
                        <label class="form-label">Select Main Category</label>
                        <select name="category" class="form-select" required>
                            <option value="">-- Choose Category --</option>
                            {% for cat in categories %}
                                <option value="{{ cat.id }}">{{ cat.name }}</option>
                            {% endfor %}
                        </select>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Sub-Category Name</label>
                        <input type="text" name="name" class="form-control" placeholder="e.g. T-Shirts" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Description</label>
                        <textarea name="descriptions" class="form-control" rows="3"></textarea>
                    </div>

                    <div class="d-flex justify-content-between">
                        <a href="{% url 'subcategory_list' %}" class="btn btn-secondary">Back</a>
                        <button type="submit" class="btn btn-primary">Save Sub-Category</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
</body>
</html>
