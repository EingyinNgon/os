<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Categories - Clothes Shop</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        body { background-color: #f8f9fa; }
        .card { border: none; border-radius: 15px; }
        .table thead { background-color: #4a4a4a; color: white; }
        .btn-add { background-color: #4a4a4a; color: white; border-radius: 8px; }
        .btn-add:hover { background-color: #333; color: white; }
    </style>
</head>
<body>

{% extends 'base.html' %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="main-card">
            <h3 class="fw-bold mb-4">Add New Category</h3>
            
            <form method="POST">
                {% csrf_token %}
                
                <div class="mb-4">
                    <label class="form-label fw-bold">Category Name</label>
                    <input type="text" 
                           name="name" 
                           class="form-control form-control-lg" 
                           placeholder="ဥပမာ - အမျိုးသားဝတ်၊ ကလေးဝတ်" 
                           required>
                    <div class="form-text">အွန်လိုင်းရှော့မှာ ပြမယ့် မိခင်အမျိုးအစား အမည်ကို ရိုက်ထည့်ပါ။</div>
                </div>

                <div class="d-grid gap-2">
                    <button type="submit" class="btn btn-primary btn-lg shadow-sm">
                        Save Category
                    </button>
                    <a href="{% url 'category_list' %}" class="btn btn-light border">
                        Cancel
                    </a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
</body>
</html>
