{% extends 'base.html' %}

{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card shadow">
                <div class="card-header bg-warning text-dark">
                    <h4 class="mb-0"><i class="bi bi-pencil-square me-2"></i>Edit Product / Item</h4>
                </div>
                <div class="card-body">
                    
                    <form method="POST" enctype="multipart/form-data">
                        {% csrf_token %}
                        
                        <div class="row">
                            <div class="col-md-6">
                                <div class="mb-3">
                                    <label class="form-label font-weight-bold">Product Name</label>
                                    <input type="text" name="name" class="form-control" value="{{ item.name }}" required>
                                </div>
                                
                                <div class="mb-3">
                                    <label class="form-label font-weight-bold">Sub-Category</label>
                                    <select name="sub_category" class="form-select" required>
                                        {% for sub in sub_categories %}
                                            <option value="{{ sub.id }}" {% if sub.id == item.sub_category.id %}selected{% endif %}>
                                                {{ sub.name }}
                                            </option>
                                        {% endfor %}
                                    </select>
                                </div>

                                <div class="mb-3">
                                    <label class="form-label font-weight-bold">Stock Amount</label>
                                    <input type="number" name="amount" class="form-control" value="{{ item.amount }}" required>
                                </div>

                                <div class="mb-3">
                                    <label class="form-label font-weight-bold">Size</label>
                                    <input type="text" name="size" class="form-control" value="{{ item.size|default_if_none:'' }}" placeholder="e.g. Large, 42">
                                </div>
                            </div>

                            <div class="col-md-6">
                                <div class="mb-3">
                                    <label class="form-label font-weight-bold">Buy Price</label>
                                    <input type="number" step="0.01" name="buy_price" class="form-control" value="{{ item.buy_price }}" required>
                                </div>

                                <div class="mb-3">
                                    <label class="form-label font-weight-bold">Sale Price</label>
                                    <input type="number" step="0.01" name="sale_price" class="form-control" value="{{ item.sale_price }}" required>
                                </div>

                                <div class="mb-3">
                                    <label class="form-label font-weight-bold">Product Image</label>
                                    <input type="file" name="item_image" class="form-control" accept="image/*">
                                    
                                    {% if item.image %}
                                        <div class="mt-2">
                                            <small class="text-muted d-block mb-1">Current Image:</small>
                                            <img src="{{ item.image.url }}" width="100" class="img-thumbnail rounded shadow-sm">
                                        </div>
                                    {% endif %}
                                </div>
                            </div>
                        </div>

                        <hr>

                        <div class="d-flex justify-content-end gap-2">
                            <a href="{% url 'item_list' %}" class="btn btn-secondary">Cancel</a>
                            <button type="submit" class="btn btn-warning px-4 font-weight-bold">Update Product</button>
                        </div>
                    </form>

                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
