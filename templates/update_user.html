<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    {% extends 'base.html' %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="main-card shadow-sm border-0 p-4">
            <h3 class="fw-bold mb-4">Edit User Profile</h3>
            <hr>

            <form method="POST">
                {% csrf_token %}
                <div class="row">
                    <div class="col-md-6 border-end">
                        <h5 class="text-warning mb-3">Account Info</h5>
                        <div class="mb-3">
                            <label class="form-label">Username</label>
                            <input type="text" name="username" class="form-control" value="{{ user_obj.username }}" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Email</label>
                            <input type="email" name="email" class="form-control" value="{{ user_obj.email }}" required>
                        </div>
                    </div>

                    <div class="col-md-6">
                        <h5 class="text-warning mb-3">Profile Details</h5>
                        <div class="mb-3">
                            <label class="form-label">Phone Number</label>
                            <input type="text" name="phone_no" class="form-control" value="{{ user_obj.userprofile.phone_no }}" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Vantor</label>
                            <input type="text" name="vantor" class="form-control" value="{{ user_obj.userprofile.vantor }}">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Address</label>
                            <textarea name="address" class="form-control" rows="1" required>{{ user_obj.userprofile.address }}</textarea>
                        </div>
                    </div>
                </div>

                <div class="mt-4 d-flex justify-content-end">
                    <a href="{% url 'user_list' %}" class="btn btn-light me-2">Cancel</a>
                    <button type="submit" class="btn btn-warning px-4">Update User</button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
</body>
</html>
