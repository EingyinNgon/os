{% extends 'base.html' %}

{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div>
                <div class="card-header">
                    <h3 class="mb-0">Add New Product / Item</h3>
                </div>
                
                <div class="card-body p-4 bg-white">
                    <form method="POST" enctype="multipart/form-data">
                        {% csrf_token %}
                        
                        <div class="row">
                            <div class="col-md-6 border-end">
                                <h6 class="text-secondary mb-3">General Info</h6>
                                
                                <div class="mb-3">
                                    <label class="form-label font-weight-bold">Product Name</label>
                                    <input type="text" name="name" class="form-control" placeholder="Enter item name" required>
                                </div>
                                
                                <div class="mb-3">
                                    <label class="form-label font-weight-bold">Sub-Category</label>
                                    <select name="sub_category" class="form-select" required>
                                        <option value="">-- Select Sub Category --</option>
                                        {% for sub in sub_categories %}
                                            <option value="{{ sub.id }}">{{ sub.name }}</option>
                                        {% endfor %}
                                    </select>
                                </div>

                                <div class="mb-3">
                                    <label class="form-label font-weight-bold">Stock Amount</label>
                                    <input type="number" name="amount" class="form-control" value="0" min="0" required>
                                </div>

                                <div class="mb-3">
                                    <label class="form-label font-weight-bold">Size <small class="text-muted">(Optional)</small></label>
                                    <input type="text" name="size" class="form-control" placeholder="e.g. Large, 42, 10-inch">
                                </div>
                            </div>

                            <div class="col-md-6">
                                <h6 class="text-secondary mb-3">Pricing & Media</h6>
                                
                                <div class="mb-3">
                                    <label class="form-label font-weight-bold">Buy Price (ဝယ်ရင်းဈေး)</label>
                                    <input type="number" step="0.01" name="buy_price" class="form-control" placeholder="0.00" required>
                                </div>

                                <div class="mb-3">
                                    <label class="form-label font-weight-bold">Sale Price (ရောင်းဈေး)</label>
                                    <input type="number" step="0.01" name="sale_price" class="form-control" placeholder="0.00" required>
                                </div>

                                <div class="mb-3">
                                    <label class="form-label font-weight-bold">Product Image</label>
                                    <input type="file" name="item_image" class="form-control" accept="image/*">
                                </div>
                            </div>
                        </div>

                        <hr class="my-4">

                        <div class="d-flex justify-content-end gap-2">
                            <a href="{% url 'item_list' %}" class="btn btn-light border px-4">Cancel</a>
                            <button type="submit" class="btn btn-primary px-4">Save Product</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
